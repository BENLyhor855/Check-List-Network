services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: racnoc
      MYSQL_USER: racnoc
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: UTC
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  prepare:
    build:
      context: ./laravel
      secrets: [proxy_ca]
    command: ["php", "artisan", "rac:prepare"]
    environment: &app
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      APP_URL: ${APP_ORIGIN:-http://localhost:4200}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: racnoc
      DB_USERNAME: racnoc
      DB_PASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      SESSION_SECURE_COOKIE: ${COOKIE_SECURE:-false}
      CACHE_STORE: file
      LOG_CHANNEL: stderr
    depends_on:
      db: {condition: service_healthy}
  app:
    build:
      context: ./laravel
      secrets: [proxy_ca]
    environment: *app
    ports: ["127.0.0.1:4200:8080"]
    depends_on:
      prepare: {condition: service_completed_successfully}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  mysql_data:
secrets:
  proxy_ca:
    file: ${RAC_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
