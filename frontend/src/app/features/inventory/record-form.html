<form class="record-form" (ngSubmit)="save(form)" #form="ngForm">
  <h2>Add {{ resource() }}</h2>
  @if (error()) {
    <p role="alert" class="error">{{ error() }}</p>
  }
  <label>Name<input name="name" [(ngModel)]="name" maxlength="120" required /></label>
  @if (resource() === 'locations') {
    <label
      >Building<select name="building" [(ngModel)]="buildingId" required>
        <option [ngValue]="null" disabled>Select a building</option>
        @for (b of buildings(); track b['id']) {
          <option [ngValue]="b['id']">{{ b['name'] }}</option>
        }
      </select></label
    >
  }
  @if (resource() === 'devices') {
    <label>Asset ID<input name="asset" [(ngModel)]="assetId" required maxlength="80" /></label
    ><label
      >Manufacturer<input name="manufacturer" [(ngModel)]="manufacturer" maxlength="80" /></label
    ><label>Model<input name="model" [(ngModel)]="model" maxlength="80" /></label
    ><label
      >Management IP<input
        name="ip"
        [(ngModel)]="managementIp"
        placeholder="Enter actual address (optional)" /></label
    ><label
      >Category<select name="category" [(ngModel)]="category">
        @for (c of ['firewall', 'switch', 'access point', 'server', 'NAS', 'other']; track c) {
          <option>{{ c }}</option>
        }
      </select></label
    ><label
      >Location<select name="location" [(ngModel)]="locationId" required>
        <option [ngValue]="null" disabled>Select a location</option>
        @for (l of locations(); track l['id']) {
          <option [ngValue]="l['id']">{{ l['name'] }}</option>
        }
      </select></label
    >
  }
  <div>
    <button [disabled]="busy() || form.invalid">Save record</button
    ><button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
