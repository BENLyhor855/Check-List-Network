server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /health/ { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
